<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1117">
  <title>Planning Annuel · Congés</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0f1117;
      --ink-soft: #6b7280;
      --ink-faint: #c4c9d4;
      --surface: #ffffff;
      --bg: #f5f6fa;
      --border: #e5e7eb;
      --accent: #4f6ef7;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 8px 24px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* LOADING */
    #loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* MAIN */
    #main-app { 
      display: none; 
      height: 100vh; 
      flex-direction: column;
      overflow: hidden;
    }

    /* TOPBAR */
    .topbar {
      height: 55px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
    }

    .topbar-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1em;
      color: var(--ink);
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-brand span { font-size: 1.2em; }

    .topbar-spacer { flex: 1; }

    .year-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
    }

    .year-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1em;
      color: var(--ink-soft);
      padding: 4px 8px;
      border-radius: 50%;
      transition: .15s ease;
    }

    .year-btn:hover { background: rgba(0,0,0,.05); color: var(--ink); }

    .year-display {
      font-family: 'DM Serif Display', serif;
      font-size: 1em;
      font-weight: 400;
      color: var(--ink);
      min-width: 60px;
      text-align: center;
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: var(--ink);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: .8em;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: .15s ease;
    }

    .btn-back:hover { opacity: .85; transform: translateY(-1px); }

    .btn-export {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: var(--success);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: .8em;
      font-weight: 600;
      cursor: pointer;
      transition: .15s ease;
    }

    .btn-export:hover { opacity: .85; }

    /* PLANNING CONTAINER */
    .planning-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow: hidden;
    }

    .planning-wrapper {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* HEADER */
    .planning-header {
      display: grid;
      grid-template-columns: 45px repeat(12, 1fr);
      background: #2c3e50;
      color: white;
      font-weight: 700;
      font-size: .65em;
      text-transform: uppercase;
      letter-spacing: .08em;
      flex-shrink: 0;
    }

    .planning-header-cell {
      padding: 8px 4px;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,.15);
    }

    .planning-header-cell:last-child { border-right: none; }

    .planning-header-cell:first-child {
      text-align: center;
      border-right: 1px solid rgba(255,255,255,.3);
      font-weight: 800;
    }

    /* BODY */
    .planning-body { 
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .planning-row {
      display: grid;
      grid-template-columns: 45px repeat(12, 1fr);
      border-bottom: 1px solid var(--border);
      flex: 1;
      position: relative;
      background: var(--surface);
      min-height: 0;
    }

    .planning-row:hover { background: var(--bg); }
    .planning-row:last-child { border-bottom: none; }

    .planning-row-label {
      padding: 4px;
      font-weight: 700;
      font-size: .75em;
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink-soft);
    }

    .planning-month-col {
      border-right: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .planning-month-col:last-child { border-right: none; }

    /* EVENTS */
    .event-bar {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 18px;
      border-radius: 3px;
      font-size: .6em;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
      cursor: pointer;
      transition: .12s ease;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    .event-bar:hover {
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      z-index: 5;
    }

    /* HOLIDAYS - fond gris avec texte */
    .holiday-marker {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .52em;
      color: #374151;
      font-weight: 700;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 3px;
      pointer-events: none;
    }

    /* WEEKEND SHADING */
    .weekend-shade {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,.02);
      pointer-events: none;
    }

    /* LEGEND */
    .legend {
      display: flex;
      gap: 12px;
      padding: 10px 16px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }

    .legend-label {
      font-size: .65em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--ink-faint);
      margin-right: 4px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .7em;
      font-weight: 500;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    /* ZOOM CONTROLS */
    .zoom-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .zoom-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: .75em;
      font-weight: 600;
      cursor: pointer;
      transition: .15s ease;
      color: var(--ink-soft);
    }

    .zoom-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(79,110,247,.05);
    }

    /* PRINT */
    @media print {
      body { overflow: visible; }
      .topbar { display: none; }
      .legend { page-break-before: avoid; }
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-soft); }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="spinner"></div>
  <p style="color:var(--ink-soft); font-weight:500;">Chargement du planning…</p>
</div>

<!-- MAIN -->
<div id="main-app">
  <div class="topbar">
    <div class="topbar-brand">
      <span>📅</span> Planning Annuel
    </div>
    <div class="year-nav">
      <button class="year-btn" onclick="changeYear(-1)">◀</button>
      <div class="year-display" id="year-display">2026</div>
      <button class="year-btn" onclick="changeYear(1)">▶</button>
    </div>
    <div class="topbar-spacer"></div>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="adjustZoom(-0.05)">−</button>
      <span style="font-size:.75em; color:var(--ink-soft); font-weight:600; min-width:50px; text-align:center;" id="zoom-display">100%</span>
      <button class="zoom-btn" onclick="adjustZoom(0.05)">+</button>
    </div>
    <button class="btn-export" onclick="exportPDF()">📥 PDF</button>
    <a href="index.html" class="btn-back">← Retour</a>
  </div>

  <div class="planning-container">
    <div class="planning-wrapper" id="planning-wrapper">
      <div class="planning-header">
        <div class="planning-header-cell">J</div>
        <div class="planning-header-cell">Jan</div>
        <div class="planning-header-cell">Fév</div>
        <div class="planning-header-cell">Mar</div>
        <div class="planning-header-cell">Avr</div>
        <div class="planning-header-cell">Mai</div>
        <div class="planning-header-cell">Jun</div>
        <div class="planning-header-cell">Jul</div>
        <div class="planning-header-cell">Aoû</div>
        <div class="planning-header-cell">Sep</div>
        <div class="planning-header-cell">Oct</div>
        <div class="planning-header-cell">Nov</div>
        <div class="planning-header-cell">Déc</div>
      </div>

      <div class="planning-body" id="planning-body"></div>

      <div class="legend">
        <span class="legend-label">Légende :</span>
        <div id="legend-items" style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
          <div class="legend-item">
            <div class="legend-dot" style="background:#e5e7eb; border:1px solid #d1d5db;"></div>
            <span style="color:#374151; font-style:italic;">Jour férié</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0uDfGAHq99p1VqRNj9pap-E7J52JlQ3w",
    authDomain: "monplanningconges.firebaseapp.com",
    projectId: "monplanningconges",
    storageBucket: "monplanningconges.firebasestorage.app",
    messagingSenderId: "633023003902",
    appId: "1:633023003902:web:de61338ee094cf3b7639af"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let userData = { leaves: [], config: {} };
  let currentYear = new Date().getFullYear();
  let zoomLevel = 1.0;

  /* ── CORRECTION FUSEAU HORAIRE : format date locale YYYY-MM-DD ── */
  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const j = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${j}`;
  }

  window.changeYear = (delta) => {
    currentYear += delta;
    document.getElementById('year-display').textContent = currentYear;
    renderPlanning();
  };

  window.adjustZoom = (delta) => {
    zoomLevel = Math.max(0.7, Math.min(1.5, zoomLevel + delta));
    document.getElementById('planning-wrapper').style.fontSize = `${zoomLevel}em`;
    document.getElementById('zoom-display').textContent = `${Math.round(zoomLevel * 100)}%`;
  };

  window.exportPDF = () => {
    Swal.fire({
      title: 'Export PDF',
      text: 'Utilisez Ctrl+P / Cmd+P pour imprimer ou enregistrer en PDF.',
      icon: 'info',
      confirmButtonText: 'Compris',
      confirmButtonColor: 'var(--accent)'
    });
    setTimeout(() => window.print(), 500);
  };

  /* ── JOURS FÉRIÉS ── CORRECTION : utilise fmtDate() au lieu de toISOString() ── */
  function getHolidays(y) {
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=Math.floor((h+l-7*m+114)/31),p=(h+l-7*m+114)%31;
    const paques = new Date(y, n - 1, p + 1); // constructeur local, pas UTC
    // ── add() utilise maintenant fmtDate() pour éviter le décalage UTC ──
    const add = (date, nb) => {
      const r = new Date(date);
      r.setDate(r.getDate() + nb);
      return fmtDate(r); // ← corrigé : était toISOString().split('T')[0]
    };
    return {
      [`${y}-01-01`]: "Jour de l'An",
      [add(paques, 1)]:  "Lundi de Pâques",
      [`${y}-05-01`]:    "Fête du Travail",
      [`${y}-05-08`]:    "Victoire 1945",
      [add(paques, 39)]: "Ascension",
      [add(paques, 50)]: "Lundi de Pentecôte",
      [`${y}-07-14`]:    "Fête Nationale",
      [`${y}-08-15`]:    "Assomption",
      [`${y}-11-01`]:    "Toussaint",
      [`${y}-11-11`]:    "Armistice",
      [`${y}-12-25`]:    "Noël"
    };
  }

  /* ── RENDER PLANNING ── */
  function renderPlanning() {
    const body = document.getElementById('planning-body');
    body.innerHTML = '';

    const holidays = getHolidays(currentYear);
    const holidayDates = Object.keys(holidays);

    // Group leaves by day (1-31)
    const dayRows = {};
    for (let day = 1; day <= 31; day++) dayRows[day] = [];

    (userData.leaves || []).forEach(leave => {
      // Décomposition locale pour éviter le décalage UTC
      const [sy, sm, sd] = leave.start.split('-').map(Number);
      const d = new Date(sy, sm - 1, sd);
      if (d.getFullYear() === currentYear) {
        const dayNum = d.getDate();
        if (!dayRows[dayNum]) dayRows[dayNum] = [];
        dayRows[dayNum].push({ ...leave, date: d });
      }
    });

    // Render 31 rows
    for (let day = 1; day <= 31; day++) {
      const row = document.createElement('div');
      row.className = 'planning-row';

      const label = document.createElement('div');
      label.className = 'planning-row-label';
      label.textContent = day;
      row.appendChild(label);

      // 12 months
      for (let month = 0; month < 12; month++) {
        const col = document.createElement('div');
        col.className = 'planning-month-col';

        // Construire la date localement (pas via new Date('YYYY-MM-DD') qui est UTC)
        const dateObj = new Date(currentYear, month, day);

        // Date inexistante dans ce mois (ex: 31 février)
        if (dateObj.getMonth() !== month || dateObj.getDate() !== day) {
          row.appendChild(col);
          continue;
        }

        const dateStr = fmtDate(dateObj);

        // Weekend shading
        const dayOfWeek = dateObj.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) {
          const shade = document.createElement('div');
          shade.className = 'weekend-shade';
          col.appendChild(shade);
        }

        // Jour férié — fond gris + nom affiché
        if (holidayDates.includes(dateStr)) {
          const hmark = document.createElement('div');
          hmark.className = 'holiday-marker';
          hmark.textContent = holidays[dateStr];
          hmark.title = holidays[dateStr];
          col.appendChild(hmark);
        }

        // Leave events (par dessus le fond férié si nécessaire)
        const leavesOnThisDay = dayRows[day].filter(l => l.date.getMonth() === month);

        leavesOnThisDay.forEach(leave => {
          const bar = document.createElement('div');
          bar.className = 'event-bar';
          bar.style.left = '3%';
          bar.style.width = '94%';
          bar.style.backgroundColor = leave.backgroundColor || '#9ca3af';

          let displayTitle = leave.title;
          if (displayTitle.length > 8) displayTitle = displayTitle.substring(0, 6) + '…';
          bar.textContent = displayTitle;
          bar.title = `${leave.title} · ${leave.start}`;

          col.appendChild(bar);
        });

        row.appendChild(col);
      }

      body.appendChild(row);
    }

    renderLegend();
  }

  function renderLegend() {
    const leg = document.getElementById('legend-items');
    // Garder le premier item "Jour férié" et reconstruire les types
    leg.innerHTML = `
      <div class="legend-item">
        <div class="legend-dot" style="background:#e5e7eb; border:1px solid #d1d5db;"></div>
        <span style="color:#374151; font-style:italic;">Jour férié</span>
      </div>`;

    const types = {};
    (userData.leaves || []).forEach(l => {
      const baseTitle = l.title.replace(/ \(Matin\)| \(Apr-Midi\)/g, '');
      if (!types[baseTitle]) {
        types[baseTitle] = { color: l.backgroundColor || '#9ca3af' };
      }
    });

    Object.keys(types).forEach(name => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `
        <div class="legend-dot" style="background:${types[name].color};"></div>
        <span>${name}</span>`;
      leg.appendChild(item);
    });
  }

  /* ── AUTH ── */
  onAuthStateChanged(auth, (user) => {
    if (user) {
      onSnapshot(doc(db, "users", user.uid), (snap) => {
        if (snap.exists()) {
          userData = snap.data();
          renderPlanning();
          document.getElementById('loading-screen').style.display = 'none';
          document.getElementById('main-app').style.display = 'flex';
        }
      });
    } else {
      window.location.href = 'index.html';
    }
  });

  document.getElementById('year-display').textContent = currentYear;
  document.getElementById('zoom-display').textContent = '100%';
</script>
</body>
</html>
